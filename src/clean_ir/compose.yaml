services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.watermark.low: ${CLEAN_ES_WATERMARK_LOW:-20gb}
      cluster.routing.allocation.disk.watermark.high: ${CLEAN_ES_WATERMARK_HIGH:-15gb}
      cluster.routing.allocation.disk.watermark.flood_stage: ${CLEAN_ES_WATERMARK_FLOOD:-10gb}
    ports:
      - "127.0.0.1:19211:9200"
    volumes:
      - clean_es:/usr/share/elasticsearch/data
volumes:
  clean_es:
